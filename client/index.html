<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta Tags -->
  <title>CosmicMail — Weekly Space Photos Delivered to Your Inbox</title>
  <meta name="description" content="Subscribe to CosmicMail and receive stunning space photos from telescopes, probes, and space agencies — curated for explorers every week." />
  <meta name="keywords" content="space photos, astronomy, nebula, galaxies, planets, NASA, space exploration, weekly newsletter" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="CosmicMail — Weekly Space Photos" />
  <meta property="og:description" content="Stunning images from telescopes, probes and space agencies — curated for explorers." />
  <meta property="og:image" content="OG_IMAGE_PLACEHOLDER" /> <!-- Replace with your OG image URL -->
  <meta property="og:url" content="YOUR_SITE_URL" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CosmicMail — Weekly Space Photos" />
  <meta name="twitter:description" content="Stunning images from telescopes, probes and space agencies — curated for explorers." />

  <!-- Fonts: Orbitron (headlines) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Favicon (rocket emoji as SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
